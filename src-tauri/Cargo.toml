[package]
name = "silajur"
version = "0.4.3"
description = "Aplikasi pendamping ARKAS untuk SPJ BOSP"
license = "MIT"
edition = "2021"

[lib]
name = "sibos_lib"
crate-type = [
	"staticlib",
	"cdylib",
	"rlib"
]

[build-dependencies]
aes-gcm = "=0.10.3"
keyring = { version = "3", features = [ "windows-native" ] }
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = [
	"aes",
	"alloc"
] }
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = [
	"jpeg",
	"png"
] }
keyring = { version = "3", features = [ "windows-native" ] }
rusqlite = { version = "0.40.2", features = [ "bundled-sqlcipher-vendored-openssl" ] }
rust_xlsxwriter = { version = "0.99.1", default-features = false }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
thiserror = "2.0.21"
zeroize = "=1.8.1"
zip = { version = "8", default-features = false, features = [ "deflate-flate2-zlib-rs" ] }

# `tauri dev`: dependensi (SQLCipher, OpenSSL, rusqlite, dll.) tetap dioptimalkan. Tanpa ini SQLCipher
# dikompilasi tanpa optimasi sehingga dekripsi ARKAS di setiap query membuat pindah halaman terasa lambat.
# Kode aplikasi sendiri tetap mode debug agar kompilasi ulang saat mengubah kode tetap cepat.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
